<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual styles: preview</title>
<!-- Dev preview of the ten visual-style prototypes (docs/25). Build the bundle first: sh build.sh. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Baloo+2:wght@600;800&family=Bangers&family=Barlow+Condensed:wght@600;700&family=Caveat:wght@500;700&family=Chakra+Petch:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Nunito:wght@600;800&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap">
<script src="dist/cwt-viz.js"></script>
<style>
body { margin: 0; background: #20201e; color: #eee; font: 13px system-ui, sans-serif; }
main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
canvas { display: block; width: 390px; height: 500px; background: #000; }
button { min-height: 32px; }
</style>
</head>
<body>
<main id="grid"></main>
<script>
// ?s=<style id> plays one style; ?m=<moment> shows a still at a named moment (see makeViz's moments). No query: all ten, live.
const q = new URLSearchParams(location.search);
const ids = (q.get('s') || Object.keys(CWTViz.styles).join(',')).split(',');
const moment = q.get('m');
const grid = document.getElementById('grid');
for (const id of ids) {
  const fig = document.createElement('figure');
  const cap = document.createElement('figcaption');
  const canvas = document.createElement('canvas');
  fig.append(canvas, cap);
  grid.append(fig);
  if (moment) {
    CWTViz.still(canvas, id, moment in CWTViz.moments ? CWTViz.moments[moment] : Number(moment), 390, 500);
    cap.textContent = CWTViz.styles[id].name;
    continue;
  }
  const ctl = CWTViz.mount(canvas, id, { width: 390, height: 500, onHud: (h) => { cap.textContent = `${CWTViz.styles[id].name} · ${h.attempt} · ${h.text}`; } });
  const btn = document.createElement('button');
  btn.textContent = 'Pause';
  btn.onclick = () => { btn.textContent = ctl.toggle() ? 'Pause' : 'Play'; };
  fig.append(btn);
}
</script>
</body>
</html>
